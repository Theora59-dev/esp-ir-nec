[package]
edition      = "2024"
name         = "esp-ir-nec"
rust-version = "1.88"
version      = "0.1.0"
description  = "Récepteur de télécommande IR NEC pour ESP32 via RMT"
repository   = "https://github.com/Theora59-dev/esp-ir-nec"
license      = "MIT"
keywords     = ["esp", "embedded", "no-std", "ir", "nec", "rmt"]
categories   = ["embedded", "no-std"]

[lib]
name = "esp_ir_nec"
path = "./src/lib.rs"

[features]
default = []
unstable = ["esp-hal/unstable"]
rmt_support = []

# Chip features - enable the one matching your target
esp32 = ["esp-hal/esp32", "rmt_support"]
esp32s2 = ["esp-hal/esp32s2", "rmt_support"]
esp32s3 = ["esp-hal/esp32s3", "rmt_support"]
esp32c2 = ["esp-hal/esp32c2", "rmt_support"]
esp32c3 = ["esp-hal/esp32c3", "rmt_support"]
esp32c5 = ["esp-hal/esp32c5", "rmt_support"]
esp32c6 = ["esp-hal/esp32c6", "rmt_support"]
esp32c61 = ["esp-hal/esp32c61", "rmt_support"]
esp32h2 = ["esp-hal/esp32h2", "rmt_support"]

[dependencies]
esp-hal = { version = "~1.1.0", default-features = false }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
